<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Account — NG Shopify</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      box-sizing: border-box;
      font-size: 10px;
    }
    *, *::before, *::after { box-sizing: inherit; }
    body {
      margin: 0;
      padding: 0;
      background-color: #0d0f12;
      color: #f3f4f6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    .site-header {
      background: #ffffff;
      color: #111827;
      padding: 18px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e5e7eb;
    }
    .site-logo {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: -0.04em;
      color: #111827;
      text-decoration: none;
    }
    .back-btn {
      color: #4b5563;
      text-decoration: none;
      font-size: 1.3rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .back-btn:hover { color: #6366f1; }

    /* Login Section */
    .login-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .login-card {
      width: 100%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 40px 32px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.35);
    }
    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-title {
      font-size: 2.8rem;
      font-weight: 800;
      margin: 0 0 8px;
      color: #ffffff;
    }
    .login-subtitle {
      font-size: 1.4rem;
      color: #9ca3af;
      margin: 0;
    }

    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-size: 1.2rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
      color: #d1d5db;
    }
    .form-input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: #ffffff;
      font-size: 1.4rem;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .form-input:focus {
      border-color: #818cf8;
      background: rgba(255, 255, 255, 0.12);
    }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 1.2rem;
      margin-bottom: 24px;
      color: #9ca3af;
    }
    .forgot-link {
      color: #818cf8;
      text-decoration: none;
      font-weight: 600;
    }
    .forgot-link:hover { text-decoration: underline; }

    .submit-btn {
      width: 100%;
      padding: 16px;
      background: #6366f1;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 1.5rem;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.2s;
    }
    .submit-btn:hover { background: #4f46e5; }

    .demo-login-btn {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e5e7eb;
      border-radius: 12px;
      font-size: 1.3rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .demo-login-btn:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }

    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 1.3rem;
      color: #9ca3af;
    }
    .login-footer a {
      color: #818cf8;
      text-decoration: none;
      font-weight: 700;
    }

    /* Success alert */
    .alert-success {
      display: none;
      padding: 14px;
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
      border-radius: 10px;
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 20px;
      text-align: center;
    }

    /* Site Footer */
    .site-footer {
      background: #0d0f12;
      color: #9ca3af;
      padding: 32px 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      text-align: center;
      font-size: 1.2rem;
    }
    .credit-link {
      color: #9ca3af;
      text-decoration: none;
      padding: 4px 12px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.15);
    }
  </style>
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <a href="index.html" class="site-logo">NG SHOPIFY</a>
    <a href="index.html" class="back-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Back to Store
    </a>
  </header>

  <!-- Login Main Section -->
  <main class="login-container">
    <div class="login-card">
      <header class="login-header">
        <h1 class="login-title">Customer Login</h1>
        <p class="login-subtitle">Sign in to access your NG Shopify account & orders</p>
      </header>

      <div id="login-alert" class="alert-success">
        ✓ Welcome back! Redirecting to storefront...
      </div>

      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required>
        </div>

        <div class="form-options">
          <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
            <input type="checkbox" checked> Remember me
          </label>
          <a href="#" class="forgot-link" onclick="alert('Password reset link sent to your email!')">Forgot Password?</a>
        </div>

        <button type="submit" class="submit-btn">Sign In</button>
        <button type="button" class="demo-login-btn" onclick="fillDemoCredentials()">⚡ Quick 1-Click Demo Login</button>
      </form>

      <footer class="login-footer">
        New to NG Shopify? <a href="#" onclick="alert('Registration is open! Fill out form to sign up.')">Create Account</a>
      </footer>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <p>NG SHOPIFY © 2026. All rights reserved.</p>
    <a href="https://digitalheroesco.com" target="_blank" rel="noopener noreferrer" class="credit-link">
      Built for Digital Heroes Training Task
    </a>
  </footer>

  <script>
    function fillDemoCredentials() {
      document.getElementById('email').value = 'customer@ngshopify.com';
      document.getElementById('password').value = 'password123';
      
      const alertBox = document.getElementById('login-alert');
      alertBox.style.display = 'block';
      alertBox.textContent = '✓ Demo credentials loaded! Click Sign In below.';
    }

    function handleLogin(e) {
      e.preventDefault();
      const alertBox = document.getElementById('login-alert');
      alertBox.style.display = 'block';
      alertBox.textContent = '✓ Login successful! Redirecting to NG Shopify store...';
      
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 1200);
    }
  </script>
</body>
</html>
